<!DOCTYPE html>
<!--
  Source for assets/images/og.png (the social-share card, 1200x630).
  Regenerate with:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --window-size=1200,630 \
      --virtual-time-budget=8000 \
      --screenshot=assets/images/og.png assets/docs/og.html
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Open Graph card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; }
    body {
        position: relative;
        overflow: hidden;
        background: #f5f2eb;
        color: #16150f;
        font-family: 'Geist', system-ui, sans-serif;
    }
    .frame {
        position: absolute;
        inset: 48px 64px;
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 56px;
    }
    .copy { display: flex; flex-direction: column; justify-content: space-between; }
    .top {
        display: flex; justify-content: space-between;
        padding-top: 14px; border-top: 1px solid #16150f;
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 17px; letter-spacing: 0.08em; text-transform: uppercase; color: #6b675c;
    }
    h1 {
        font-family: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
        font-weight: 400;
        font-size: 100px;
        line-height: 0.96;
        letter-spacing: -0.025em;
    }
    h1 em { font-style: italic; color: #b8381a; }
    .bottom { display: flex; align-items: baseline; gap: 22px; font-size: 26px; color: #47443b; }
    .bottom strong { font-weight: 500; color: #16150f; }
    .bottom span { color: #bdb7a6; }
    .photo {
        align-self: end;
        width: 300px; height: 375px;
        object-fit: cover; object-position: center 20%;
        border-radius: 8px; border: 1px solid #d8d3c5;
    }
</style>
</head>
<body>
    <div class="frame">
        <div class="copy">
            <div class="top"><span>Flutter &amp; Kotlin developer</span><span>Tehran</span></div>
            <h1>I ship whole products, <em>not just screens.</em></h1>
            <div class="bottom"><strong>Naeim Lotfali</strong><span>/</span>naeimlotfali.github.io</div>
        </div>
        <img class="photo" src="../images/profile.png" alt="">
    </div>
</body>
</html>
